<!doctype html>
<!--
  Page 404 de GitHub Pages (servie pour toute adresse inconnue sous fio-tlb.github.io/fiona-talbi-portfolio/).
  HTML autonome : ni JavaScript ni police à télécharger. Les liens sont absolus et suivent la base
  du site (/fiona-talbi-portfolio/) : à modifier si le site change d'adresse (domaine personnel).
  Textes repris de errorContent.notFound dans src/data/portfolio.ts.
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page introuvable — Fiona Talbi</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f7efe4" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="/fiona-talbi-portfolio/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/fiona-talbi-portfolio/apple-touch-icon.png" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: #f7efe4;
        color: #311b1a;
        font:
          17px/1.6 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        width: min(1180px, 100% - 2 * clamp(20px, 0.5rem + 3vw, 40px));
        margin-inline: auto;
      }
      header {
        border-bottom: 1px solid #dacfc3;
      }
      header .wrap {
        display: flex;
        align-items: center;
        height: 64px;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        font:
          400 22px/1 Georgia,
          "Times New Roman",
          serif;
        letter-spacing: -0.01em;
        color: #311b1a;
        text-decoration: none;
      }
      main {
        flex: 1;
        padding-block: clamp(40px, 14vh, 160px) 96px;
      }
      .eyebrow {
        margin: 0 0 16px;
        font-size: 15px;
        font-weight: 600;
        color: #6f5752;
      }
      h1 {
        margin: 0;
        font:
          400 clamp(34px, 1.5rem + 2.6vw, 56px) / 1.12 Georgia,
          "Times New Roman",
          serif;
        letter-spacing: -0.02em;
      }
      .text {
        max-width: 36rem;
        margin: 20px 0 0;
        font-size: clamp(18px, 1.05rem + 0.3vw, 20px);
        line-height: 1.55;
        color: #6f5752;
      }
      .action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        margin-top: 36px;
        padding: 12px 20px;
        border-radius: 8px;
        background: #7a1e2c;
        color: #fcf9f3;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.3;
        text-decoration: none;
        transition: background-color 200ms cubic-bezier(0.2, 0.65, 0.3, 1);
      }
      .action:active {
        scale: 0.97;
      }
      .contact {
        margin: 28px 0 0;
        font-size: 15px;
        color: #6f5752;
      }
      .contact a {
        color: #7a1e2c;
        text-decoration-color: rgb(122 30 44 / 40%);
        text-underline-offset: 4px;
        overflow-wrap: anywhere;
      }
      :focus-visible {
        outline: 2px solid #7a1e2c;
        outline-offset: 3px;
        border-radius: 2px;
      }
      @media (hover: hover) and (pointer: fine) {
        .brand:hover {
          color: #7a1e2c;
        }
        .action:hover {
          background: #56161e;
        }
        .contact a:hover {
          text-decoration-color: currentColor;
        }
      }
      @media (max-width: 720px), (orientation: landscape) and (max-height: 500px) {
        header .wrap {
          height: 56px;
        }
      }
      @media (max-width: 480px) {
        .action {
          width: 100%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .action {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap">
        <a class="brand" href="/fiona-talbi-portfolio/">Fiona Talbi</a>
      </div>
    </header>
    <main class="wrap">
      <p class="eyebrow">Erreur 404</p>
      <h1>Page introuvable</h1>
      <p class="text">
        Cette page n’existe pas ou a été déplacée. Le portfolio, lui, est toujours là.
      </p>
      <a class="action" href="/fiona-talbi-portfolio/">Retour au portfolio</a>
      <p class="contact">
        Ou écrivez-moi&nbsp;: <a href="mailto:fiona.2001@live.fr">fiona.2001@live.fr</a>
      </p>
    </main>
  </body>
</html>
